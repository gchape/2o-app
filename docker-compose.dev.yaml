name: 2o-dev

x-app-env: &app-env
  env_file:
    - .env.development
  environment:
    NODE_ENV: development
    DB_HOST: db
    DB_PORT: "5432"
    DB_SSL: "false"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    BETTER_AUTH_URL: http://localhost:3000
    SITE_URL: http://localhost:3000

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: dev
    <<: *app-env
    command: ["pnpm", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: dev
    <<: *app-env
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  checkout-notifications:
    build:
      context: .
      target: dev
    <<: *app-env
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
    command: ["pnpm", "checkout:notifications"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: nginx:1.31-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - type: bind
        source: ./nginx.dev.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  node_modules:

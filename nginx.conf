map $http_x_forwarded_proto $forwarded_proto {
	default $http_x_forwarded_proto;
	"" $scheme;
}

upstream app {
	server app:3000;
	keepalive 16;
}

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# Behind another proxy/CDN? Uncomment and list ONLY its ranges, or every
	# client shares that proxy's IP (and one sign-in rate limit).
	# set_real_ip_from 10.0.0.0/8;
	# real_ip_header   X-Forwarded-For;
	# real_ip_recursive on;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	# A location with its own add_header drops these, so /assets/ repeats one.
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Strict-Transport-Security "max-age=31536000" always;
	# No script-src: the app's inline scripts have no nonces, so it would break.
	add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	location ~* \.(?:ico|png|jpg|jpeg|webp|svg|txt|webmanifest)$ {
		expires 7d;
		try_files $uri @app;
	}

	location / {
		try_files /dev/null @app;
	}

	location @app {
		proxy_pass http://app;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		# Overwrite, don't append: the app trusts the first entry for rate limiting.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $forwarded_proto;
	}
}

upstream app {
    zone app 64k;
    # Docker's embedded DNS must be consulted again after app recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    server app:3000 resolve;
    keepalive 16;
    keepalive_timeout 4s;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types
        text/css
        text/plain
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # Nginx >= 1.29.3: locations can add caching headers without copying these.
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        # Only successful responses are immutable; never cache a missing chunk.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # These filenames are not content-hashed, so use a short cache lifetime.
    location /images/ {
        try_files $uri =404;
        expires 1d;
    }

    location = /favicon.ico {
        expires 1d;
    }

    location = /apple-icon-180x180.png {
        expires 1d;
    }

    # All other paths belong to the router, including / and /robots.txt.
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off; # Preserve TanStack Start's streamed SSR responses.
        # Auth/session cookies may exceed Nginx's default 4 KiB header buffer.
        proxy_buffer_size 16k;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
